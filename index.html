<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Carlo | Professional Virtual Assistant</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { overflow-x: hidden; }
        .hover-lift { transition: transform 0.25s, box-shadow 0.25s; }
        .hover-lift:hover { transform: translateY(-6px); box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #2d6a4f, #40916c); color: white; border: none; padding: 14px 30px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: all 0.25s; text-decoration: none; display: inline-block; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(45,106,79,0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const NAV_LINKS = ["About","Industries","Services","Portfolio","Testimonials","Contact"];

        const INDUSTRIES = [
            { icon: "🌿", title: "Spa & Wellness", accent: "#388e3c", desc: "Appointment scheduling, client follow-ups, and booking system updates." },
            { icon: "🏥", title: "Medical Clinics", accent: "#1565c0", desc: "Patient intake, calendar management, and HIPAA-aware admin support." },
            { icon: "✨", title: "Beauty Clinics", accent: "#c2185b", desc: "Consultation booking, DM management, and Canva graphics." },
            { icon: "🏡", title: "Real Estate", accent: "#6a1b9a", desc: "Lead follow-up, CRM updates, and listing coordination." },
            { icon: "🧹", title: "Cleaning Services", accent: "#f57f17", desc: "Quote request handling and crew coordination support." },
            { icon: "🏗️", title: "Construction", accent: "#7b1fa2", desc: "Subcontractor coordination and project file organization." },
            { icon: "🎯", title: "Coaches", accent: "#00695c", desc: "Onboarding automation and discovery call scheduling." },
            { icon: "🛒", title: "Small Businesses", accent: "#e65100", desc: "Daily operations, order tracking, and general admin." },
        ];

        const SERVICES = [
            { cat: "Admin Support", icon: "📋", accent: "#2e7d32", items: ["Calendar Management", "Email Inbox Control", "Data Entry", "CRM Maintenance"] },
            { cat: "Customer Support", icon: "💬", accent: "#1565c0", items: ["Lead Nurturing", "Inquiry Handling", "Review Management", "WhatsApp Support"] },
            { cat: "Social Media", icon: "📱", accent: "#ad1457", items: ["Canva Graphic Design", "Content Scheduling", "Caption Writing", "Engagement"] },
            { cat: "Operations", icon: "🚀", accent: "#f57f17", items: ["Email Campaigns", "Automation Setup", "SOP Creation", "GMB Updates"] }
        ];

        function Counter({ value, label, suffix = "" }) {
            const [count, setCount] = useState(0);
            const [triggered, setTriggered] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setTriggered(true); }, { threshold: 0.1 });
                if (ref.current) obs.observe(ref.current);
                return () => obs.disconnect();
            }, []);

            useEffect(() => {
                if (!triggered) return;
                let start = 0;
                const timer = setInterval(() => {
                    start += Math.ceil(value / 30);
                    if (start >= value) { setCount(value); clearInterval(timer); }
                    else setCount(start);
                }, 40);
                return () => clearInterval(timer);
            }, [triggered, value]);

            return (
                <div ref={ref} style={{ textAlign: "center" }}>
                    <div style={{ fontSize: "2.5rem", fontWeight: 800, color: "#2d6a4f", fontFamily: "Playfair Display" }}>{count}{suffix}</div>
                    <div style={{ fontSize: "0.85rem", color: "#666", fontWeight: 600, textTransform: "uppercase" }}>{label}</div>
                </div>
            );
        }

        function App() {
            const [dark, setDark] = useState(false);
            const [activeService, setActiveService] = useState(0);
            const [openFaq, setOpenFaq] = useState(null);

            const theme = {
                bg: dark ? "#0f1117" : "#fafaf8",
                text: dark ? "#f0f0ee" : "#1a1a2e",
                card: dark ? "#1c1f2e" : "#ffffff",
                muted: dark ? "#9a9aa8" : "#666677",
                border: dark ? "#2a2d3e" : "#eaeae8"
            };

            return (
                <div style={{ background: theme.bg, color: theme.text, fontFamily: "'DM Sans', sans-serif", transition: "0.3s" }}>
                    
                    {/* Navigation */}
                    <nav style={{ position: "sticky", top: 0, zIndex: 100, background: dark ? "rgba(15,17,23,0.9)" : "rgba(250,250,248,0.9)", backdropFilter: "blur(10px)", borderBottom: `1px solid ${theme.border}`, padding: "15px 24px" }}>
                        <div style={{ maxWidth: 1100, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                            <div style={{ fontWeight: 800, fontSize: "1.2rem", letterSpacing: "-0.5px" }}>
                                KIM<span style={{ color: "#2d6a4f" }}>CARLO</span> VA
                            </div>
                            <div style={{ display: "flex", gap: "20px", alignItems: "center" }}>
                                <div className="desktop-only" style={{ display: "flex", gap: "20px" }}>
                                    {NAV_LINKS.map(link => (
                                        <a key={link} href={`#${link.toLowerCase()}`} style={{ textDecoration: "none", color: theme.muted, fontSize: "0.9rem", fontWeight: 600 }}>{link}</a>
                                    ))}
                                </div>
                                <button onClick={() => setDark(!dark)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "1.2rem" }}>
                                    {dark ? "☀️" : "🌙"}
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section style={{ padding: "100px 24px", textAlign: "center" }}>
                        <div style={{ maxWidth: 850, margin: "0 auto" }}>
                            <span style={{ background: "#e8f5e9", color: "#2d6a4f", padding: "6px 16px", borderRadius: "20px", fontSize: "0.8rem", fontWeight: 700 }}>AVAILABLE FOR NEW PROJECTS</span>
                            <h1 style={{ fontFamily: "Playfair Display", fontSize: "clamp(2.5rem, 6vw, 4.5rem)", lineHeight: 1.1, margin: "24px 0" }}>
                                Helping Businesses Run <span style={{ color: "#2d6a4f" }}>Smoother</span> Behind the Scenes
                            </h1>
                            <p style={{ color: theme.muted, fontSize: "1.2rem", marginBottom: "40px" }}>Reliable Virtual Assistance for Admin, Operations, and Customer Support.</p>
                            <a href="#contact" className="btn-primary">Book a Discovery Call</a>
                        </div>
                    </section>

                    {/* Stats */}
                    <section style={{ background: theme.card, padding: "60px 24px", borderY: `1px solid ${theme.border}` }}>
                        <div style={{ maxWidth: 1000, margin: "0 auto", display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: "40px" }}>
                            <Counter value={3} label="Years Experience" suffix="+" />
                            <Counter value={50} label="Projects Completed" suffix="+" />
                            <Counter value={100} label="Client Satisfaction" suffix="%" />
                            <Counter value={8} label="Industries Served" />
                        </div>
                    </section>

                    {/* Industries Section */}
                    <section id="industries" style={{ padding: "100px 24px" }}>
                        <div style={{ maxWidth: 1100, margin: "0 auto" }}>
                            <h2 style={{ fontFamily: "Playfair Display", fontSize: "2.5rem", textAlign: "center", marginBottom: "50px" }}>Industries I Support</h2>
                            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))", gap: "24px" }}>
                                {INDUSTRIES.map(ind => (
                                    <div key={ind.title} className="hover-lift" style={{ background: theme.card, padding: "30px", borderRadius: "20px", border: `1px solid ${theme.border}`, borderTop: `4px solid ${ind.accent}` }}>
                                        <div style={{ fontSize: "2.5rem", marginBottom: "15px" }}>{ind.icon}</div>
                                        <h3 style={{ marginBottom: "10px" }}>{ind.title}</h3>
                                        <p style={{ color: theme.muted, fontSize: "0.9rem", lineHeight: 1.6 }}>{ind.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Services Section */}
                    <section id="services" style={{ padding: "100px 24px", background: dark ? "#141720" : "#f0fdf4" }}>
                        <div style={{ maxWidth: 900, margin: "0 auto" }}>
                            <h2 style={{ fontFamily: "Playfair Display", fontSize: "2.5rem", textAlign: "center", marginBottom: "40px" }}>Core Services</h2>
                            <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: "10px", marginBottom: "30px" }}>
                                {SERVICES.map((s, i) => (
                                    <button key={s.cat} onClick={() => setActiveService(i)} style={{ padding: "10px 20px", borderRadius: "30px", border: "none", background: activeService === i ? "#2d6a4f" : theme.card, color: activeService === i ? "white" : theme.text, cursor: "pointer", fontWeight: 600 }}>
                                        {s.icon} {s.cat}
                                    </button>
                                ))}
                            </div>
                            <div style={{ background: theme.card, padding: "40px", borderRadius: "24px", border: `1px solid ${theme.border}` }}>
                                <ul style={{ listStyle: "none", display: "grid", gridTemplateColumns: "1fr 1fr", gap: "15px" }}>
                                    {SERVICES[activeService].items.map(item => (
                                        <li key={item} style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                                            <span style={{ color: "#2d6a4f", fontWeight: "bold" }}>✓</span> {item}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                    </section>

                    {/* Contact Section */}
                    <section id="contact" style={{ padding: "100px 24px" }}>
                        <div style={{ maxWidth: 600, margin: "0 auto", textAlign: "center" }}>
                            <h2 style={{ fontFamily: "Playfair Display", fontSize: "2.5rem", marginBottom: "20px" }}>Let's Work Together</h2>
                            <p style={{ color: theme.muted, marginBottom: "40px" }}>Ready to scale your business? Send me a message or book a call.</p>
                            <form style={{ display: "flex", flexDirection: "column", gap: "15px", textAlign: "left" }}>
                                <input type="text" placeholder="Name" style={{ padding: "15px", borderRadius: "12px", border: `1px solid ${theme.border}`, background: theme.card, color: theme.text }} />
                                <input type="email" placeholder="Email" style={{ padding: "15px", borderRadius: "12px", border: `1px solid ${theme.border}`, background: theme.card, color: theme.text }} />
                                <textarea placeholder="Message" rows="5" style={{ padding: "15px", borderRadius: "12px", border: `1px solid ${theme.border}`, background: theme.card, color: theme.text }}></textarea>
                                <button type="button" className="btn-primary">Send Message</button>
                            </form>
                        </div>
                    </section>

                    <footer style={{ padding: "40px 24px", textAlign: "center", borderTop: `1px solid ${theme.border}` }}>
                        <p style={{ color: theme.muted, fontSize: "0.9rem" }}>© 2026 Kim Carlo VA. Based in the Philippines. Available Worldwide.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
